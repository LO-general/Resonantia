    <script>
      // In AI Studio iFrame environment, WebSocket connections for HMR are not proxied.
      // Intercept WebSocket creation for Vite HMR to prevent @vite/client connection errors.
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          var MockWebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            if (urlStr.includes('/@vite/') || urlStr.includes('vite') || urlStr.includes(window.location.host)) {
              var dummy = {
                url: urlStr,
                readyState: 3, // CLOSED
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              return dummy;
            }
            return new RealWebSocket(url, protocols);
          };
          MockWebSocket.prototype = RealWebSocket.prototype;
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          window.WebSocket = MockWebSocket;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var str = String(event.reason?.stack || event.reason?.message || event.reason || '');
          if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('closed without opened')) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = String(event.message || '');
          var src = String(event.filename || '');
          var stk = String(event.error?.stack || '');
          if (msg.includes('WebSocket') || src.includes('@vite/client') || stk.includes('@vite/client') || src.includes(':236')) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
